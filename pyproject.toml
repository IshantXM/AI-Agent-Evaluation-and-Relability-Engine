[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-evaluation-engine"
version = "0.1.0"
description = "Structured AI-agent trace evaluation and reliability analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy",
  "pydantic",
  "requests",
  "psycopg2-binary",
  "python-dotenv",
  "python-multipart",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["backend*"]
